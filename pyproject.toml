[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinetic"
version = "0.1.0"
description = "KINETIC: an autonomous coding agent built on the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KINETIC" }]
dependencies = [
    "claude-agent-sdk>=0.2.130",
    "anyio>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "ruff>=0.5",
]

[project.scripts]
kinetic = "cli.main:main"

[tool.hatch.build.targets.wheel]
# Phase 7.2: the application source lives as top-level packages/modules at the
# repository root (the `kinetic` namespace was intentionally removed). List the
# packages and the loose root-level modules explicitly so the wheel ships exactly
# the application source — no tests/, no .venv/, no build artifacts.
only-include = [
    "agent",
    "cli",
    "config",
    "context",
    "dependencies",
    "environment",
    "events",
    "intelligence",
    "memory",
    "observability",
    "project",
    "security",
    "tasks",
    "tools",
    "web",
    "errors.py",
    "lifecycle.py",
    "paths.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # SDK warning about allowed_tools auto-approving tools (pre-existing Phase 1
    # behavior; not a Phase 5 concern). The can_use_tool gate still runs for
    # tools that are not blanket-allowed.
    'ignore:can_use_tool will not be invoked:UserWarning',
    # TestClient (httpx) deprecation about raw bytes uploads; we use content=
    # in tests, but the legacy client may still emit this in some versions.
    'ignore:Use .*content=<\\.\\.\\.>.* to upload raw bytes:DeprecationWarning',
    # In the P7.3 web tests a background pump coroutine may be created on a
    # short-lived test event loop that closes before it is awaited (a test
    # artifact of the in-process TestClient portal, not a production issue).
    "ignore:coroutine 'WebConsole._pump_events' was never awaited:RuntimeWarning",
    # Starlette's pure-ASGI middleware + the in-process TestClient portal can
    # surface an unraisable GeneratorExit when the portal's loop closes while a
    # background task is still pending. Production runs under uvicorn where the
    # loop persists across requests; this is a test-only teardown artifact.
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
