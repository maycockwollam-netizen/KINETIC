[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinetic"
version = "0.1.0"
description = "KINETIC: an autonomous coding agent built on the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KINETIC" }]
dependencies = [
    "claude-agent-sdk>=0.2.130",
    "anyio>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
kinetic = "cli.main:main"

[tool.hatch.build.targets.wheel]
# Phase 7.2: the application source lives as top-level packages/modules at the
# repository root (the `kinetic` namespace was intentionally removed). List the
# packages and the loose root-level modules explicitly so the wheel ships exactly
# the application source — no tests/, no .venv/, no build artifacts.
only-include = [
    "agent",
    "cli",
    "config",
    "context",
    "dependencies",
    "environment",
    "events",
    "intelligence",
    "memory",
    "observability",
    "project",
    "security",
    "store",
    "tasks",
    "tools",
    "web",
    "errors.py",
    "lifecycle.py",
    "paths.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # SDK warning about allowed_tools auto-approving tools (pre-existing Phase 1
    # behavior; not a Phase 5 concern). The can_use_tool gate still runs for
    # tools that are not blanket-allowed.
    'ignore:can_use_tool will not be invoked:UserWarning',
    # TestClient (httpx) deprecation about raw bytes uploads; we use content=
    # in tests, but the legacy client may still emit this in some versions.
    'ignore:Use .*content=<\\.\\.\\.>.* to upload raw bytes:DeprecationWarning',
    # In the P7.3 web tests a background pump coroutine may be created on a
    # short-lived test event loop that closes before it is awaited (a test
    # artifact of the in-process TestClient portal, not a production issue).
    "ignore:coroutine 'WebConsole._pump_events' was never awaited:RuntimeWarning",
    # Starlette's pure-ASGI middleware + the in-process TestClient portal can
    # surface an unraisable GeneratorExit when the portal's loop closes while a
    # background task is still pending. Production runs under uvicorn where the
    # loop persists across requests; this is a test-only teardown artifact.
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
# Measure the application source only (never tests, venv, or build artifacts).
source = [
    "agent", "cli", "config", "context", "dependencies", "environment",
    "events", "intelligence", "memory", "observability", "project",
    "security", "store", "tasks", "tools", "web", "errors", "lifecycle",
    "paths",
]
branch = true
omit = ["*/__pycache__/*", "tests/*", ".venv/*", "build/*", "dist/*"]

[tool.coverage.report]
# Show untested lines so developers can target real gaps (not to be gamed).
show_missing = true
skip_covered = false
# Conservative regression guard. Baseline (P7.4): 82% total branch coverage.
# Docker integration paths (~22% of environment/docker.py) and live-SDK paths
# are legitimately skipped in CI (no daemon / no ANTHROPIC_API_KEY), so the
# threshold is set comfortably below the measured baseline to catch major
# regressions without forcing coverage gaming. Raise it only when real tests
# are added — never lower it to hide a drop.
fail_under = 75
# Exclude trivially-unreachable guard lines from the missing report.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
# P7.4: verify the existing type quality (99.3% return annotations) without a
# giant type-system rewrite. Strict-ish defaults with documented relaxations
# where the third-party SDK / pydantic dynamic surface makes strict checking
# noisy. This baseline run reports real errors; it is NOT wired into the CI
# fail step yet (see CONTRIBUTING.md / CHANGELOG). It is a baseline + local
# guard to be tightened over time.
python_version = "3.11"
# The repo root has an __init__.py (product version marker), which makes mypy
# ambiguous about module names (KINETIC.agent vs agent). explicit_package_bases
# + mypy_path="." resolves imports to the top-level package names the project
# actually uses (from agent import ..., from tasks import ...).
explicit_package_bases = true
mypy_path = "."
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# The Claude Agent SDK ships without inline stubs; treat it as untyped rather
# than failing every call site. Same for pydantic internal plugin noise.
ignore_missing_imports = true
# Exclude generated/vendored/build paths.
exclude = ["tests/", "build/", "dist/", "\\.venv/"]

[[tool.mypy.overrides]]
# Pydantic v2 uses dynamic field creation that mypy cannot fully follow.
module = ["pydantic.*", "pydantic_settings.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# The SDK wrapper surface is large and untyped; do not block on its internals.
module = ["claude_agent_sdk.*"]
ignore_errors = true

